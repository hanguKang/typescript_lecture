<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>ProjectManager</title>
    <link rel="stylesheet" href="./style/app.css" />
    <script src="./lect_drag_1_122_origin_test.js" defer></script>
</head>

<body>
    <template id="project-input">
        <form>
            <div class="form-control">
                <label for="title">Title</label>
                <input type="text" id="title" />
            </div>
            <div class="form-control">
                <label for="description">Description</label>
                <textarea id="description" rows="3"></textarea>
            </div>
            <div class="form-control">
                <label for="people">People</label>
                <input type="number" id="people" step="1" min="3" max="10" value="3" />
            </div>
            <button type="submit">ADD PROJECT</button>
        </form>
    </template>
    <template id="single-project">
        <li>
            <h2></h2><!--ProjectType 클래스에 저장된 title -->
            <h3></h3><!-- ProjectType 클래스에 저장된 people -->
            <p></p><!-- ProjectTyped 클래스에 저장된 desript-->
        </li>
    </template>
    <template id="project-list">
        <section class="projects">
            <header>
                <h2></h2>
            </header>
            <ul></ul>
        </section>
    </template>
    <div id="app"></div>
</body>

</html>
